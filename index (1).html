<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--bg2:#f5f5f4;--bg3:#efefed;
    --text:#1a1a18;--muted:#6b6b67;--hint:#a8a8a4;
    --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);
    --radius:12px;--sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
    --indigo:#6366f1;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;--text:#f0f0ec;--muted:#8a8a86;--hint:#5a5a56;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18)}
    .icon-btn.del:hover{background:#3b1f1f!important;color:#f87171!important;border-color:#5a2a2a!important}
    .setup-box{background:#242422!important;border-color:rgba(255,255,255,.12)!important}
    .setup-box input{background:#1c1c1a!important;color:#f0f0ec!important;border-color:rgba(255,255,255,.15)!important}
  }
  body{font-family:var(--sans);font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh}
  .app{display:flex;height:100vh;overflow:hidden}

  /* SIDEBAR */
  .sidebar{width:210px;min-width:210px;background:var(--bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto}
  .logo{font-size:15px;font-weight:500;padding:0 18px 18px;color:var(--text);border-bottom:0.5px solid var(--border);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .logo-icon{width:22px;height:22px;background:var(--text);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .logo-icon svg{width:12px;height:12px;fill:var(--bg)}
  .sync-dot{width:7px;height:7px;border-radius:50%;margin-left:auto;flex-shrink:0;transition:background .3s}
  .sync-dot.ok{background:#22c55e}
  .sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
  .sync-dot.err{background:#ef4444}
  .sync-dot.local{background:var(--hint)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sidebar-title{font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--hint);padding:0 18px 8px;text-transform:uppercase}
  .cat-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;border-radius:7px;margin:0 6px;font-size:13px;color:var(--muted);transition:background .12s,color .12s;user-select:none}
  .cat-item:hover,.cat-item.active{background:var(--bg2);color:var(--text)}
  .cat-item.active{font-weight:500}
  .cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:8px}
  .cat-count{font-size:11px;color:var(--hint);font-family:var(--mono)}
  .cat-label{display:flex;align-items:center;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .cat-del{opacity:0;font-size:11px;color:var(--hint);padding:1px 4px;border-radius:4px;transition:opacity .12s,background .12s}
  .cat-item:hover .cat-del{opacity:1}
  .cat-del:hover{background:rgba(239,68,68,.12);color:#ef4444}
  .new-cat-row{display:flex;gap:6px;padding:8px 10px;margin-top:6px;border-top:0.5px solid var(--border)}
  .new-cat-input{flex:1;padding:6px 9px;font-size:12px;font-family:var(--sans);border:0.5px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);outline:none}
  .new-cat-input:focus{border-color:var(--border2)}
  .new-cat-btn{padding:6px 10px;font-size:13px;border:none;border-radius:6px;background:var(--text);color:var(--bg);cursor:pointer;font-weight:500}

  /* SIDEBAR BOTTOM BUTTONS */
  .sidebar-bottom{margin-top:auto;padding:10px;border-top:0.5px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .sidebar-btn{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:7px;font-size:12px;color:var(--muted);cursor:pointer;border:none;background:transparent;width:100%;font-family:var(--sans);transition:background .12s,color .12s}
  .sidebar-btn:hover{background:var(--bg2);color:var(--text)}
  .sidebar-btn svg{width:13px;height:13px;opacity:.6}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--bg);border-bottom:0.5px solid var(--border)}
  .search-wrap{position:relative;flex:1}
  .search-wrap input{width:100%;padding:8px 12px 8px 34px;background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--sans);color:var(--text);outline:none;transition:border .12s}
  .search-wrap input:focus{border-color:var(--border2)}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--hint);pointer-events:none;font-size:15px}
  .btn-add{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--text);color:var(--bg);border:none;border-radius:8px;font-size:13px;font-family:var(--sans);font-weight:500;cursor:pointer;white-space:nowrap;transition:opacity .12s}
  .btn-add:hover{opacity:.82}
  .grid-wrap{flex:1;overflow-y:auto;padding:20px}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .section-header h2{font-size:15px;font-weight:500}
  .section-header span{font-size:12px;color:var(--hint);font-family:var(--mono)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

  /* CARDS */
  .link-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .12s,background .12s;position:relative;display:flex;flex-direction:column;gap:8px}
  .link-card:hover{border-color:var(--border2);background:var(--bg2)}
  .card-favicon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;font-family:var(--mono)}
  .card-header{display:flex;align-items:flex-start;gap:8px}
  .card-title{font-size:13px;font-weight:500;color:var(--text);flex:1;line-height:1.4;word-break:break-word}
  .card-url{font-family:var(--mono);font-size:11px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:20px;border:0.5px solid var(--border);color:var(--muted);width:fit-content;margin-top:auto}
  .card-tag-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .card-actions{display:flex;gap:4px;position:absolute;top:10px;right:10px;opacity:0;transition:opacity .12s}
  .link-card:hover .card-actions{opacity:1}
  .icon-btn{width:26px;height:26px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--muted);transition:background .1s,color .1s;user-select:none}
  .icon-btn:hover{background:var(--bg3);color:var(--text)}
  .icon-btn.del:hover{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
  .drag-handle{position:absolute;bottom:8px;right:10px;color:var(--hint);font-size:11px;cursor:grab;opacity:0;transition:opacity .12s;user-select:none}
  .link-card:hover .drag-handle{opacity:1}
  .link-card.dragging{opacity:.35;border-style:dashed}
  .link-card.drag-over{border-color:#6366f1;border-width:1.5px;background:rgba(99,102,241,.06)}
  .drag-hint{font-size:11px;color:var(--hint);margin-bottom:10px}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:220px;color:var(--hint);gap:10px}
  .empty-icon{font-size:32px;opacity:.4}
  .empty p{font-size:13px}

  /* MODALS */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:26px;width:430px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.15)}
  .modal h3{font-size:16px;font-weight:500;margin-bottom:20px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field label{font-size:12px;color:var(--muted);font-weight:500}
  .field input,.field select,.field textarea{padding:9px 11px;border:0.5px solid var(--border2);border-radius:8px;font-size:13px;font-family:var(--sans);color:var(--text);background:var(--bg2);outline:none;transition:border .12s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#6366f1}
  .field textarea{resize:vertical;min-height:60px;font-size:12px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .btn-cancel{padding:8px 16px;border:0.5px solid var(--border2);border-radius:8px;background:transparent;font-size:13px;font-family:var(--sans);color:var(--muted);cursor:pointer}
  .btn-cancel:hover{background:var(--bg2)}
  .btn-save{padding:8px 16px;border:none;border-radius:8px;background:var(--text);color:var(--bg);font-size:13px;font-family:var(--sans);font-weight:500;cursor:pointer}
  .btn-save:hover{opacity:.82}

  /* SETUP SCREEN */
  .setup-screen{position:fixed;inset:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .setup-box{background:var(--bg);border:0.5px solid var(--border2);border-radius:16px;padding:32px;width:100%;max-width:460px;box-shadow:0 8px 40px rgba(0,0,0,.1)}
  .setup-box h2{font-size:18px;font-weight:500;margin-bottom:6px}
  .setup-box p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
  .setup-box .field label{display:flex;align-items:center;justify-content:space-between}
  .setup-box .field label a{font-size:11px;color:var(--indigo);text-decoration:none;font-weight:400}
  .setup-box input{width:100%;padding:9px 11px;border:0.5px solid var(--border2);border-radius:8px;font-size:13px;font-family:var(--mono);color:var(--text);background:var(--bg2);outline:none}
  .setup-box input:focus{border-color:var(--indigo)}
  .setup-steps{background:var(--bg2);border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:12px;color:var(--muted);line-height:2}
  .setup-steps b{color:var(--text)}
  .setup-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
  .btn-skip{padding:8px 14px;border:0.5px solid var(--border2);border-radius:8px;background:transparent;font-size:13px;font-family:var(--sans);color:var(--muted);cursor:pointer}
  .btn-connect{padding:8px 18px;border:none;border-radius:8px;background:var(--indigo);color:#fff;font-size:13px;font-family:var(--sans);font-weight:500;cursor:pointer}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:9px;font-size:13px;font-family:var(--sans);opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const COLORS=['#6366f1','#14b8a6','#f97316','#ec4899','#84cc16','#3b82f6','#a855f7','#f59e0b','#ef4444','#06b6d4'];
const LS_LINKS='lo_links', LS_CATS='lo_cats', LS_SB_URL='lo_sb_url', LS_SB_KEY='lo_sb_key';

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
let sb = null;
let syncStatus = 'local'; // local | syncing | ok | err

function initSupabase(url, key){
  try {
    sb = supabase.createClient(url, key);
    return true;
  } catch(e) {
    return false;
  }
}

async function sbLoad(){
  if(!sb) return null;
  try {
    const {data, error} = await sb.from('lo_data').select('*').eq('id','main').single();
    if(error && error.code !== 'PGRST116') throw error;
    return data;
  } catch(e){ return null; }
}

async function sbSave(){
  if(!sb) return;
  setSyncStatus('syncing');
  try {
    const payload = {
      id: 'main',
      links: state.links,
      categories: state.categories,
      updated_at: new Date().toISOString()
    };
    const {error} = await sb.from('lo_data').upsert(payload);
    if(error) throw error;
    setSyncStatus('ok');
  } catch(e){
    setSyncStatus('err');
    console.warn('Supabase save failed:', e.message);
  }
}

function setSyncStatus(s){
  syncStatus = s;
  const dot = document.getElementById('syncDot');
  if(dot){ dot.className = 'sync-dot ' + s; dot.title = {local:'Local only',syncing:'Syncing…',ok:'Synced',err:'Sync error'}[s]||s; }
}

// ─── STATE ────────────────────────────────────────────────────────────────────
function loadLocal(){
  try {
    return {
      links: JSON.parse(localStorage.getItem(LS_LINKS)||'[]'),
      categories: JSON.parse(localStorage.getItem(LS_CATS)||'["All"]'),
    };
  } catch { return {links:[],categories:['All']}; }
}

function saveLocal(){
  localStorage.setItem(LS_LINKS, JSON.stringify(state.links));
  localStorage.setItem(LS_CATS, JSON.stringify(state.categories));
}

async function save(){
  saveLocal();
  await sbSave();
}

const stored = loadLocal();
let state = {
  links: stored.links.length ? stored.links : [
    {id:1,title:'Anthropic',url:'https://anthropic.com',category:'AI'},
    {id:2,title:'Claude',url:'https://claude.ai',category:'AI'},
    {id:3,title:'GitHub',url:'https://github.com',category:'Dev'},
    {id:4,title:'MDN Web Docs',url:'https://developer.mozilla.org',category:'Dev'},
  ],
  categories: stored.categories.length > 1 ? stored.categories : ['All','AI','Dev'],
  activeCategory:'All',
  search:'',
  modal:null,
  editId:null,
  showSetup: false,
};
let nextId = state.links.reduce((m,l)=>Math.max(m,l.id),0)+1;

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  const savedUrl = localStorage.getItem(LS_SB_URL);
  const savedKey = localStorage.getItem(LS_SB_KEY);

  if(savedUrl && savedKey){
    initSupabase(savedUrl, savedKey);
    setSyncStatus('syncing');
    const remote = await sbLoad();
    if(remote){
      state.links = remote.links || state.links;
      state.categories = remote.categories || state.categories;
      nextId = state.links.reduce((m,l)=>Math.max(m,l.id),0)+1;
      saveLocal();
      setSyncStatus('ok');
    } else {
      setSyncStatus('err');
    }
  } else if(!savedUrl){
    // First time — show setup
    state.showSetup = true;
  }
  render();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function getColor(cat){ const idx=state.categories.filter(c=>c!=='All').indexOf(cat); return COLORS[Math.abs(idx)%COLORS.length]; }
function domainOf(url){ try{return new URL(url).hostname.replace('www.','')}catch{return url} }
function initials(title){ return title.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?' }
function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function escS(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tid); t._tid=setTimeout(()=>t.classList.remove('show'),1800); }
function filtered(){
  let links=state.links;
  if(state.activeCategory!=='All') links=links.filter(l=>l.category===state.activeCategory);
  if(state.search){ const q=state.search.toLowerCase(); links=links.filter(l=>l.title.toLowerCase().includes(q)||l.url.toLowerCase().includes(q)||l.category.toLowerCase().includes(q)); }
  return links;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  if(state.showSetup){ app.innerHTML = renderSetup(); return; }
  const cats=state.categories, links=filtered();
  app.innerHTML=`
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon"><svg viewBox="0 0 12 12"><rect x="1" y="1" width="4" height="4" rx="1"/><rect x="7" y="1" width="4" height="4" rx="1"/><rect x="1" y="7" width="4" height="4" rx="1"/><rect x="7" y="7" width="4" height="4" rx="1"/></svg></div>
      Links
      <span class="sync-dot ${syncStatus}" id="syncDot" title="${{local:'Local only',syncing:'Syncing…',ok:'Synced',err:'Sync error'}[syncStatus]||syncStatus}"></span>
    </div>
    <div class="sidebar-title">Collections</div>
    ${cats.map(cat=>{
      const count=cat==='All'?state.links.length:state.links.filter(l=>l.category===cat).length;
      const color=cat==='All'?'var(--hint)':getColor(cat);
      return `<div class="cat-item${state.activeCategory===cat?' active':''}" onclick="setCategory('${escS(cat)}')">
        <span class="cat-label"><span class="cat-dot" style="background:${color}"></span>${escH(cat)}</span>
        <span style="display:flex;align-items:center;gap:4px">
          ${cat!=='All'?`<span class="cat-del" onclick="event.stopPropagation();deleteCategory('${escS(cat)}')" title="Remove">✕</span>`:''}
          <span class="cat-count">${count}</span>
        </span>
      </div>`;
    }).join('')}
    <div class="new-cat-row">
      <input class="new-cat-input" id="newCatInput" placeholder="New collection…" onkeydown="if(event.key==='Enter')addCategory()">
      <button class="new-cat-btn" onclick="addCategory()">+</button>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-btn" onclick="exportData()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M5 7l3 3 3-3M3 12h10"/></svg>
        Export JSON
      </button>
      <label class="sidebar-btn" style="cursor:pointer">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 14V6M5 9l3-3 3 3M3 4h10"/></svg>
        Import JSON
        <input type="file" accept=".json" style="display:none" onchange="importData(event)">
      </label>
      <button class="sidebar-btn" onclick="showSyncSetup()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 0 1 10.5-4M14 8a6 6 0 0 1-10.5 4"/><path d="M12 4l.5 2.5-2.5.5M4 12l-.5-2.5 2.5-.5"/></svg>
        ${sb ? 'Sync settings' : 'Connect sync'}
      </button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input placeholder="Search links…" value="${escH(state.search)}" oninput="setSearch(this.value)">
      </div>
      <button class="btn-add" onclick="openModal()">+ Add link</button>
    </div>
    <div class="grid-wrap">
      <div class="section-header">
        <h2>${escH(state.activeCategory)}</h2>
        <span>${links.length} link${links.length!==1?'s':''}</span>
      </div>
      ${state.activeCategory==='All'&&links.length>1?`<div class="drag-hint">⠿ Drag to reorder</div>`:''}
      ${links.length===0?`<div class="empty"><div class="empty-icon">◻</div><p>No links here yet.</p></div>`:''}
      <div class="grid">
        ${links.map(link=>{
          const color=getColor(link.category), draggable=state.activeCategory==='All';
          return `<div class="link-card" data-id="${link.id}" ${draggable?'draggable="true"':''} onclick="openLink('${escS(link.url)}')" ${draggable?`ondragstart="onDragStart(event,${link.id})" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,${link.id})" ondragend="onDragEnd(event)"`:''}> 
            <div class="card-actions">
              <div class="icon-btn" onclick="event.stopPropagation();copyUrl('${escS(link.url)}')" title="Copy URL">⎘</div>
              <div class="icon-btn" onclick="event.stopPropagation();openEditModal(${link.id})" title="Edit">✎</div>
              <div class="icon-btn del" onclick="event.stopPropagation();deleteLink(${link.id})" title="Delete">✕</div>
            </div>
            <div class="card-header">
              <div class="card-favicon" style="background:${color}20;color:${color};border:0.5px solid ${color}30">${escH(initials(link.title))}</div>
              <div class="card-title">${escH(link.title)}</div>
            </div>
            <div class="card-url">${escH(domainOf(link.url))}</div>
            <div class="card-tag"><span class="card-tag-dot" style="background:${color}"></span>${escH(link.category)}</div>
            ${draggable?'<div class="drag-handle">⠿⠿</div>':''}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  ${state.modal?renderModal():''}`;
}

function renderSetup(){
  return `<div class="setup-screen">
    <div class="setup-box">
      <h2>Connect cloud sync</h2>
      <p>Your links will automatically sync across all your devices — phone, laptop, anywhere. Uses Supabase (free).</p>
      <div class="setup-steps">
        <b>Quick setup (2 min):</b><br>
        1. Go to <a href="https://supabase.com" target="_blank" style="color:#6366f1">supabase.com</a> → New project (free)<br>
        2. Go to <b>SQL Editor</b> and run the SQL below<br>
        3. Go to <b>Settings → API</b> → copy URL + anon key
      </div>
      <div class="field">
        <label>SQL to run in Supabase <a href="#" onclick="copySQL()">Copy SQL ⎘</a></label>
        <textarea readonly style="font-family:monospace;font-size:11px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:8px;padding:10px;color:var(--muted);height:70px">create table if not exists lo_data (id text primary key, links jsonb, categories jsonb, updated_at timestamptz); alter table lo_data enable row level security; create policy "public" on lo_data for all using (true) with check (true);</textarea>
      </div>
      <div class="field">
        <label>Supabase Project URL</label>
        <input id="sb-url" placeholder="https://xxxx.supabase.co" value="${localStorage.getItem(LS_SB_URL)||''}">
      </div>
      <div class="field">
        <label>Anon/Public Key</label>
        <input id="sb-key" placeholder="eyJ…" value="${localStorage.getItem(LS_SB_KEY)||''}">
      </div>
      <div class="setup-actions">
        <button class="btn-skip" onclick="skipSetup()">Use offline</button>
        <button class="btn-connect" onclick="connectSupabase()">Connect & Sync →</button>
      </div>
    </div>
  </div>`;
}

function renderModal(){
  const isEdit=state.editId!==null, link=isEdit?state.links.find(l=>l.id===state.editId):null;
  const cats=state.categories.filter(c=>c!=='All');
  return `<div class="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>${isEdit?'Edit link':'Add new link'}</h3>
      <div class="field"><label>Title</label><input id="m-title" value="${escH(link?link.title:'')}" placeholder="e.g. Hacker News"></div>
      <div class="field"><label>URL</label><input id="m-url" value="${escH(link?link.url:'')}" placeholder="https://..." onblur="autoFillTitle()"></div>
      <div class="field"><label>Collection</label>
        <select id="m-cat">${cats.length?cats.map(c=>`<option${(link&&link.category===c)||(!link&&state.activeCategory===c&&c!=='All')?' selected':''}>${escH(c)}</option>`).join(''):'<option>Uncategorized</option>'}</select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveLink()">Save</button>
      </div>
    </div>
  </div>`;
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
window.setCategory=c=>{state.activeCategory=c;render()}
window.setSearch=v=>{state.search=v;render()}
window.openModal=()=>{state.modal=true;state.editId=null;render();setTimeout(()=>document.getElementById('m-url')&&document.getElementById('m-url').focus(),50)}
window.openEditModal=id=>{state.modal=true;state.editId=id;render()}
window.closeModal=()=>{state.modal=null;state.editId=null;render()}
window.openLink=url=>window.open(url,'_blank')
window.copyUrl=url=>navigator.clipboard.writeText(url).then(()=>showToast('URL copied')).catch(()=>showToast(url))

window.deleteLink=id=>{state.links=state.links.filter(l=>l.id!==id);save();showToast('Removed');render()}
window.deleteCategory=cat=>{
  if(state.links.some(l=>l.category===cat)){showToast('Remove all links from "'+cat+'" first');return}
  state.categories=state.categories.filter(c=>c!==cat);
  if(state.activeCategory===cat)state.activeCategory='All';
  save();render();
}
window.autoFillTitle=()=>{
  const t=document.getElementById('m-title'),u=document.getElementById('m-url');
  if(t&&u&&!t.value.trim()&&u.value.trim()){try{t.value=new URL(u.value).hostname.replace('www.','')}catch{}}
}
window.saveLink=()=>{
  const title=(document.getElementById('m-title').value||'').trim();
  let url=(document.getElementById('m-url').value||'').trim();
  const cat=document.getElementById('m-cat').value;
  if(!url){showToast('Enter a URL');return}
  if(!url.startsWith('http'))url='https://'+url;
  if(state.editId!==null){
    const link=state.links.find(l=>l.id===state.editId);
    if(link){link.title=title||domainOf(url);link.url=url;link.category=cat}
  } else {
    state.links.push({id:nextId++,title:title||domainOf(url),url,category:cat});
    if(state.activeCategory!==cat&&state.activeCategory!=='All')state.activeCategory=cat;
  }
  save();closeModal();showToast(state.editId!==null?'Updated':'Saved');
}
window.addCategory=()=>{
  const inp=document.getElementById('newCatInput');
  const v=(inp?inp.value:'').trim();
  if(v&&!state.categories.includes(v)){state.categories.push(v);state.activeCategory=v;save()}
  render();
}

// ─── EXPORT / IMPORT ──────────────────────────────────────────────────────────
window.exportData=()=>{
  const data={links:state.links,categories:state.categories,exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='links-backup.json';a.click();
  showToast('Exported!');
}
window.importData=async(e)=>{
  const file=e.target.files[0]; if(!file) return;
  try {
    const text=await file.text();
    const data=JSON.parse(text);
    if(data.links&&Array.isArray(data.links)){
      state.links=data.links;
      if(data.categories&&Array.isArray(data.categories))state.categories=data.categories;
      nextId=state.links.reduce((m,l)=>Math.max(m,l.id),0)+1;
      save();showToast('Imported '+data.links.length+' links');render();
    }
  } catch{ showToast('Invalid file'); }
}

// ─── SYNC SETUP ───────────────────────────────────────────────────────────────
window.showSyncSetup=()=>{state.showSetup=true;render()}
window.skipSetup=()=>{
  localStorage.setItem(LS_SB_URL,'__skipped__');
  state.showSetup=false;render();
}
window.connectSupabase=async()=>{
  const url=(document.getElementById('sb-url').value||'').trim();
  const key=(document.getElementById('sb-key').value||'').trim();
  if(!url||!key){showToast('Fill in both fields');return}
  localStorage.setItem(LS_SB_URL,url);localStorage.setItem(LS_SB_KEY,key);
  if(!initSupabase(url,key)){showToast('Invalid credentials');return}
  state.showSetup=false;
  setSyncStatus('syncing');render();
  // Try to load remote first
  const remote=await sbLoad();
  if(remote&&remote.links&&remote.links.length>0){
    // Merge: remote wins for existing, keep local-only ones
    const remoteIds=new Set(remote.links.map(l=>l.id));
    const localOnly=state.links.filter(l=>!remoteIds.has(l.id));
    state.links=[...remote.links,...localOnly];
    state.categories=remote.categories||state.categories;
    nextId=state.links.reduce((m,l)=>Math.max(m,l.id),0)+1;
    saveLocal();
  }
  await sbSave();
  showToast('Connected & synced!');render();
}
window.copySQL=()=>{
  const sql=`create table if not exists lo_data (id text primary key, links jsonb, categories jsonb, updated_at timestamptz); alter table lo_data enable row level security; create policy "public" on lo_data for all using (true) with check (true);`;
  navigator.clipboard.writeText(sql).then(()=>showToast('SQL copied!'));
  return false;
}

// ─── DRAG ─────────────────────────────────────────────────────────────────────
let dragSrcId=null;
window.onDragStart=(e,id)=>{dragSrcId=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>e.target.closest('.link-card').classList.add('dragging'),0)}
window.onDragOver=(e)=>{e.preventDefault();e.dataTransfer.dropEffect='move';const c=e.target.closest('.link-card');if(c)c.classList.add('drag-over')}
window.onDragLeave=(e)=>{const c=e.target.closest('.link-card');if(c)c.classList.remove('drag-over')}
window.onDrop=(e,targetId)=>{
  e.preventDefault();e.stopPropagation();
  const c=e.target.closest('.link-card');if(c)c.classList.remove('drag-over');
  if(dragSrcId===null||dragSrcId===targetId)return;
  const fi=state.links.findIndex(l=>l.id===dragSrcId),ti=state.links.findIndex(l=>l.id===targetId);
  if(fi===-1||ti===-1)return;
  const moved=state.links.splice(fi,1)[0];state.links.splice(ti,0,moved);
  save();render();
}
window.onDragEnd=()=>{dragSrcId=null;document.querySelectorAll('.link-card').forEach(c=>c.classList.remove('dragging','drag-over'))}

// ─── START ────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
